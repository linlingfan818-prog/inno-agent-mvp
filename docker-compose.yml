version: '3.8'

services:
  inno-agent:
    build: .
    container_name: inno_agent_mvp
    # 🌟 Windows Docker 无法使用 network_mode: host，必须显式映射端口
    ports:
      - "8001:8001"
    restart: always
    
    # 允许容器通过 host.docker.internal 访问 Windows 宿主机
    extra_hosts:
      - "host.docker.internal:host-gateway"
      
    environment:
      # 🌟 Windows 下必须用 host.docker.internal 替代 127.0.0.1 来访问宿主机的代理软件
      - HTTP_PROXY=http://host.docker.internal:3128
      - HTTPS_PROXY=http://host.docker.internal:3128
      - http_proxy=http://host.docker.internal:3128
      - https_proxy=http://host.docker.internal:3128
      # 强行把公司大模型网关放入豁免白名单
      - NO_PROXY=localhost,127.0.0.1,host.docker.internal,api.llm-incubator.automotive.cloud
      - no_proxy=localhost,127.0.0.1,host.docker.internal,api.llm-incubator.automotive.cloud
      
    # 挂载本地代码，方便后面我们修改节点逻辑时支持热重载（无需频繁 rebuild）
    volumes:
      - .:/app